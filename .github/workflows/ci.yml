name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ygo-scanner
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name scanner -p 8787:8787 ygo-scanner
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          docker logs scanner; exit 1
      - run: docker rm -f scanner
      - name: Compose smoke test (no ./data directory yet)
        run: |
          rm -rf data
          docker compose up -d --no-build
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && break; sleep 1; done
          docker compose logs
          test -f data/cert.pem
          docker compose down
